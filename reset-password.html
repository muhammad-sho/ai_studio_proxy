<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reset Password — AI Studio Proxy</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet"><style>*{box-sizing:border-box;margin:0;padding:0}body{font-family:'Plus Jakarta Sans',system-ui,sans-serif;background:#f8fafc;color:#0f172a;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}.card{background:#fff;border:1px solid #e2e8f0;border-radius:0;padding:32px;width:100%;max-width:440px;box-shadow:0 4px 12px rgba(0,0,0,.05)}.brand{display:flex;align-items:center;gap:10px;margin-bottom:8px}.badge{width:32px;height:32px;background:#0f172a;color:#fff;border-radius:0;font-weight:800;font-size:13px;display:flex;align-items:center;justify-content:center}h1{font-size:20px;font-weight:800;letter-spacing:-.02em}p{font-size:13px;color:#64748b;margin-bottom:20px;line-height:1.5}label{display:block;font-size:12px;font-weight:700;color:#475569;margin-bottom:6px}input{font-family:inherit;font-size:14px;width:100%;padding:10px 14px;border:1px solid #cbd5e1;border-radius:0;outline:none;margin-bottom:14px}input:focus{border-color:#0f172a}button{font-family:inherit;font-size:14px;font-weight:700;width:100%;padding:12px;border:none;border-radius:0;background:#0f172a;color:#fff;cursor:pointer;margin-top:6px}button:hover{background:#334155}a{color:#0f172a;font-size:13px;font-weight:700;text-decoration:none}a:hover{text-decoration:underline}.secondary{background:#e2e8f0;color:#0f172a;margin:0 0 16px}.secondary:hover{background:#cbd5e1}</style></head><body><div class="card"><div class="brand"><div class="badge">AS</div><h1>Reset Password</h1></div><p>Request a recovery code, then retrieve it from the local service logs. The code expires after 15 minutes.</p><form id="reset"><label>Username</label><input name="username" placeholder="Username" required><button class="secondary" type="button" id="requestCode">Get Recovery Code</button><label>Recovery Code</label><input name="recoveryCode" autocomplete="one-time-code" placeholder="Recovery code from service logs" required><label>New Password</label><input name="password" type="password" minlength="8" placeholder="Password (8+ chars)" required><label>Confirm New Password</label><input name="passwordConfirmation" type="password" minlength="8" placeholder="Re-enter password" required><button>Reset Password</button></form><div id="result"></div><p style="margin:18px 0 0"><a href="/">&larr; Back to Sign In</a></p></div><script>requestCode.onclick=async()=>{const username=String(new FormData(reset).get("username")||"");if(!username)return alert("Enter your username first");const r=await fetch("/api/password-reset-code",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({username})});const d=await r.json();if(!r.ok)return alert(d.error);result.innerHTML='<p style="color:#0f172a;font-weight:700;margin:0 0 18px">Recovery code written to the service logs. Enter it below within 15 minutes.</p>'};reset.onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target),password=String(f.get("password")||""),passwordConfirmation=String(f.get("passwordConfirmation")||"");if(password!==passwordConfirmation)return alert("Passwords do not match");const r=await fetch("/api/reset-password",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({username:f.get("username"),recoveryCode:f.get("recoveryCode"),password,passwordConfirmation})});const d=await r.json();if(!r.ok)return alert(d.error);result.innerHTML='<p style="color:#0f172a;font-weight:700;margin:18px 0 0">Password reset. Sign in with the new password.</p>';e.target.remove()}</script></body></html>
