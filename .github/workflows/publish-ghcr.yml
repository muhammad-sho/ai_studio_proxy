name: Publish container image

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify application
        run: |
          node --check server.js
          find lib -type f -name '*.js' -print0 | xargs -0 -r -n 1 node --check
          find dashboard -type f -name '*.js' -print0 | xargs -0 -r -n 1 node --check
          node --test
          sh -n entrypoint.sh

      - name: Build container for smoke test
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: ai-studio-proxy:ci

      - name: Verify container startup
        run: |
          mkdir -p ci-data
          touch ci-data/local-gemini-proxy.db
          docker run -d --rm --name ai-studio-proxy-ci \
            -p 19009:9009 -p 19008:9008 \
            -v "$PWD/ci-data:/data" \
            ai-studio-proxy:ci
          cleanup() {
            docker logs ai-studio-proxy-ci
            docker stop ai-studio-proxy-ci || true
          }
          trap cleanup EXIT
          wait_for_health() {
            url="$1"
            for attempt in $(seq 1 20); do
              if curl --fail --silent "$url" >/dev/null 2>&1; then
                return 0
              fi
              sleep 1
            done
            echo "Timed out waiting for $url" >&2
            return 1
          }
          wait_for_health http://127.0.0.1:19009/health
          wait_for_health http://127.0.0.1:19008/health
          test -f ci-data/ai-studio-proxy.db
          test ! -e ci-data/local-gemini-proxy.db

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/muhammad-sho/ai-studio-proxy
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}

      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
