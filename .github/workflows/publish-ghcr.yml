name: Publish container image

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify application
        run: |
          node --check server.js
          find lib -type f -name '*.js' -print0 | xargs -0 -r -n 1 node --check
          find dashboard -type f -name '*.js' -print0 | xargs -0 -r -n 1 node --check
          node --test
          sh -n entrypoint.sh

      - name: Build container for smoke test
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: ai-studio-proxy:ci

      - name: Verify Compose deployment
        run: |
          docker tag ai-studio-proxy:ci ghcr.io/muhammad-sho/ai-studio-proxy:latest
          project=ai-studio-proxy-ci
          mkdir -p volumes
          printf 'DB_PATH=/data/compose-test.db\n' > volumes/.env
          cleanup() {
            status=$?
            if [ "$status" -ne 0 ]; then
              docker compose -p "$project" logs || true
            fi
            docker compose -p "$project" down --volumes --remove-orphans || true
            trap - EXIT
            exit "$status"
          }
          trap cleanup EXIT
          wait_for_health() {
            url="$1"
            for attempt in $(seq 1 20); do
              if curl --fail --silent "$url" >/dev/null 2>&1; then
                return 0
              fi
              sleep 1
            done
            echo "Timed out waiting for $url" >&2
            return 1
          }
          docker compose -p "$project" config --quiet
          docker compose -p "$project" up -d
          wait_for_health http://127.0.0.1:9009/health
          wait_for_health http://127.0.0.1:9008/health
          curl --fail --silent --show-error -X POST http://127.0.0.1:9009/api/setup \
            -H 'content-type: application/json' \
            -d '{"username":"compose-test","password":"testpass123","passwordConfirmation":"testpass123"}' >/dev/null
          curl --fail --silent --show-error http://127.0.0.1:9009/reset-password | grep -q "Get Recovery Code"
          test -f volumes/compose-test.db
          if docker run --rm -e DB_PATH=/ai-studio-proxy.db ai-studio-proxy:ci >/dev/null 2>&1; then
            echo "unsafe DB_PATH unexpectedly started the container" >&2
            exit 1
          fi

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/muhammad-sho/ai-studio-proxy
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}

      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
