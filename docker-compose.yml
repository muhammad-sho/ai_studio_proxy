services:
  ai-studio-proxy:
    image: ${AI_STUDIO_PROXY_IMAGE:-ghcr.io/muhammad-sho/ai-studio-proxy:latest}
    restart: unless-stopped
    stop_grace_period: 5s
    ports:
      - "${ADMIN_PORT:-9009}:${ADMIN_PORT:-9009}"
      - "${API_PORT:-9008}:${API_PORT:-9008}"
    volumes:
      - ${DATA_DIR:-./data}:/data:Z
    environment:
      ADMIN_PORT: "${ADMIN_PORT:-9009}"
      API_PORT: "${API_PORT:-9008}"
      DB_PATH: "${DB_PATH:-/data/ai-studio-proxy.db}"
      REQUEST_TIMEOUT_MS: "${REQUEST_TIMEOUT_MS:-120000}"
      MAX_BODY_BYTES: "${MAX_BODY_BYTES:-52428800}"
      MAX_RESPONSE_BYTES: "${MAX_RESPONSE_BYTES:-52428800}"
      LOG_BODY_MAX_BYTES: "${LOG_BODY_MAX_BYTES:-65536}"
      MAX_LOG_ENTRIES: "${MAX_LOG_ENTRIES:-1000}"
      MODELS_CACHE_TTL_HOURS: "${MODELS_CACHE_TTL_HOURS:-24}"
      TRUST_PROXY: "${TRUST_PROXY:-}"
      DEBUG: "${DEBUG:-}"
      CORS_ORIGIN: "${CORS_ORIGIN:-*}"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
