services:
  ai-studio-proxy:
    image: ghcr.io/muhammad-sho/ai-studio-proxy:latest
    restart: unless-stopped
    environment: {}
    # Add optional values here. See .env.example for every supported setting.
    # DEBUG: "1"
    # CORS_ORIGIN: "https://app.example.com"
    ports:
      - "9009:9009"
      - "9008:9008"
    volumes:
      - ./volumes:/data
