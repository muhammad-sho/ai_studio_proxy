services:
  ai-studio-proxy:
    image: ghcr.io/muhammad-sho/ai-studio-proxy:latest
    container_name: ai-studio-proxy
    restart: unless-stopped
    ports:
      - "9009:9009"
      - "9008:9008"
    volumes:
      - ./data:/data:Z
    environment:
      ADMIN_PORT: 9009
      API_PORT: 9008
      DB_PATH: /data/ai-studio-proxy.db
